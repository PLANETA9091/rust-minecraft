[package]
name = "mc-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Minecraft client (Rust): CPU reference renderer + windowed fly camera"

[features]
default = []
gpu = []
# real speaker output (rodio/CPAL). Off by default: CI/headless has no audio
# device; the code falls back to the deterministic silent backend.
audio = ["dep:rodio"]

[dependencies]
anyhow.workspace = true
png.workspace = true
rayon.workspace = true
clap.workspace = true
# the first-person hand verifies the skin asset against the generated sha1
sha1.workspace = true
hex.workspace = true
serde_json.workspace = true
# the server list's own JSON store (the ServerList save/load law)
serde.workspace = true
mc-assets = { path = "../mc-assets" }
mc-registry = { path = "../mc-registry" }
# real server-list ping + login for the multiplayer screen
mc-protocol = { path = "../mc-protocol" }
# official menu music: decode real .ogg bytes (no device needed -> tested in CI)
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "wav", "pcm"] }
# output backend, feature-gated (needs the OS audio stack + ALSA headers on Linux)
# (rodio 0.20 has playback built in; its features only gate decoder crates)
rodio = { version = "0.20", optional = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb.workspace = true
