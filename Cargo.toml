[workspace]
resolver = "2"
members = [
    "crates/mc2rs-gen",
    "crates/mc-protocol",
    "crates/mc-registry",
    "crates/mc-assets",
    "crates/mc-client",
    "crates/mc2rs-pixel",
]

[workspace.package]
version = "0.3.606"
edition = "2021"
license = "MIT"
repository = "https://github.com/PLANETA9091/rust-minecraft"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "gzip"] }
sha1 = "0.10"
hex = "0.4"
zip = "2"
flate2 = "1"
png = "0.17"
rayon = "1"
minifb = "0.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# The test builds carry NO debuginfo: the generated tables passed ~7 MB of
# source (v0.3.70's textures.rs — 2,241,536 texels), and rustc's debuginfo
# over those array literals OOMs 4 GB test runners (SIGKILL mid-link). The
# release profile never carried debuginfo — this aligns test builds with it.
[profile.test]
debug = 0
