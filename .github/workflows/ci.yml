name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests (protocol, registry, mesher, raster)
        run: cargo test --workspace
      - name: Build generator + pixel harness (release)
        run: cargo build --release -p mc2rs-gen -p mc2rs-pixel

  generate:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26.2 = latest unobfuscated release; 1.21.1 = obfuscated-era regression target
        version: [26.2, 1.21.1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Mojang downloads
        uses: actions/cache@v4
        with:
          path: .mc2rs
          key: mojang-${{ matrix.version }}-v1
      - name: Generate workspace for ${{ matrix.version }}
        run: cargo run -p mc2rs-gen --release -- generate --version ${{ matrix.version }}
      - name: Generated registry must compile
        run: cargo check -p mc-registry
      - name: Codegen drift detection (byte-stable output, pinned target 26.2)
        if: matrix.version == '26.2'
        run: |
          if ! git diff --exit-code -- crates/mc-registry/src/generated crates/mc-client/src/build_info.rs mc2rs-report.json; then
            echo "::error::generated code drifted for ${{ matrix.version }}"
            git diff --stat
            exit 1
          fi

  client:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build client (CPU reference renderer)
        run: cargo build --release -p mc-client
      - name: Headless deterministic render
        run: cargo run --release -p mc-client -- --headless --width 320 --height 180 --frames 2 --out shots/render.png
      - uses: actions/upload-artifact@v4
        with:
          name: render-320x180
          path: shots/

  gui-pixel:
    needs: client
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { screen: title, frame: 30 }
          - { screen: servers, frame: 60 }
          - { screen: loading, frame: 15 }
          - { screen: world, frame: 30 }
          - { screen: worldnight, frame: 30 }
          - { screen: pause, frame: 30 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Mojang downloads
        uses: actions/cache@v4
        with:
          path: .mc2rs
          key: mojang-26.2-v1
      - name: Generate official data (fonts, lang, sprites, sounds, worldgen, atlas)
        run: cargo run -p mc2rs-gen --release -- generate --version 26.2
      - name: Render deterministic GUI screen
        run: |
          cargo run --release -p mc-client -- \
            --screen ${{ matrix.screen }} --ui-frame ${{ matrix.frame }} \
            --seed 20260214 --width 320 --height 180 \
            --out gui_${{ matrix.screen }}.png
      - name: Pixel compare vs golden (bit-exact)
        run: |
          cargo run --release -p mc2rs-pixel -- \
            --a gui_${{ matrix.screen }}.png \
            --b goldens/gui_${{ matrix.screen }}_320x180.png \
            --out diff_${{ matrix.screen }}.png --max-rms 0
      - name: Upload GUI pixel artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-pixel-${{ matrix.screen }}
          path: |
            gui_${{ matrix.screen }}.png
            diff_${{ matrix.screen }}.png
          if-no-files-found: ignore

  pixel:
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Render fresh frame (identical seed/camera)
        run: cargo run --release -p mc-client -- --headless --width 320 --height 180 --frames 1 --out fresh.png
      - name: Golden present?
        id: golden
        run: echo "present=$(test -f goldens/cpu_320x180.png && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Pixel compare vs golden
        if: steps.golden.outputs.present == 'yes'
        run: cargo run --release -p mc2rs-pixel -- --a fresh.png --b goldens/cpu_320x180.png --out diff.png --max-rms 8
      - name: Render network-view frame (wire fixture)
        run: cargo run --release -p mc-client -- --headless --net-world --width 320 --height 180 --frames 1 --out net.png
      - name: Network golden present?
        id: net_golden
        run: echo "present=$(test -f goldens/net_320x180.png && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Pixel compare network view vs golden
        if: steps.net_golden.outputs.present == 'yes'
        run: cargo run --release -p mc2rs-pixel -- --a net.png --b goldens/net_320x180.png --out net_diff.png --max-rms 8
      - name: Render network-view frame at the second matrix size
        run: cargo run --release -p mc-client -- --headless --net-world --width 480 --height 270 --frames 1 --out net480.png
      - name: Network 480x270 golden present?
        id: net480_golden
        run: echo "present=$(test -f goldens/net_480x270.png && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Pixel compare network view (480x270) vs golden
        if: steps.net480_golden.outputs.present == 'yes'
        run: cargo run --release -p mc2rs-pixel -- --a net480.png --b goldens/net_480x270.png --out net480_diff.png --max-rms 8
      - name: Upload pixel artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-diff
          path: |
            diff.png
            fresh.png
            net.png
            net_diff.png
            net480.png
            net480_diff.png
          if-no-files-found: ignore
